<!DOCTYPE html>
<html lang="en" class="morpho-theme">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
{{HEAD_META}}
<title>{{TITLE}}</title>
<link rel="icon" href="https://raw.githubusercontent.com/dougbutner/Bridged-EASY-Contracts/main/SOLOMON-logo-v2-1080.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/morpho.css">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/parallax.css">
</head>
<body class="morpho-layout home-page">
<div class="m-layout">

{{NAV}}

<main>
  <section class="m-hero" aria-label="Hero">
    <div class="m-hero-sticky" data-m-hero-sticky>
      <div class="m-hero-pin" data-m-hero-pin>
        <div class="m-hero-canvas-wrap" data-parallax="0.25">
          <canvas id="sphere-canvas" aria-hidden="true"></canvas>
        </div>
        <div class="m-hero-content">
          <div class="m-hero-top" data-m-hero-top>
            <h1 class="m-hero-title m-hero-title-gradient">{{HERO_HEADLINE}}</h1>
            <p class="m-hero-subtitle">{{HERO_SUBHEAD}}</p>
          </div>
          <div class="m-hero-center">
            <h2 class="m-hero-center-title" data-m-hero-center-title>{{HERO_CENTER_TITLE}}</h2>
            <p class="m-hero-center-sub" data-m-hero-center-sub>{{HERO_CENTER_SUB}}</p>
          </div>
          <div class="m-hero-bottom">
            <div class="m-hero-stats">
{{HOME_STATS}}
            </div>
            <div class="m-scroll-hint">Scroll to explore</div>
          </div>
        </div>
      </div>
    </div>
  </section>

{{HOME_SECTIONS}}

  <div class="m-home-extra">
{{HOME_FRONT_SECTION}}
    <div class="m-investor-link">
      <a href="/info.html" data-gated-target="/info">Investor Info</a>
    </div>
  </div>
</main>

{{FOOTER}}

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="/assets/js/gate.js" defer></script>
<script src="/assets/js/morpho.js" defer></script>
<script type="module" src="/assets/js/morpho-sphere.js"></script>
<script src="/assets/js/parallax.js" defer></script>
</body>
</html>
